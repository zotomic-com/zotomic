name: Lighthouse CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          AUTH_JWT_SECRET: ci-placeholder-secret-value-for-build-only
          ENCRYPTION_KEY: ci-placeholder-encryption-key-32b
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      - name: Run Lighthouse
        run: |
          npm i -g @lhci/cli
          npm run start &
          npx wait-on http://localhost:3000 -t 60000
          lhci autorun || echo "Lighthouse budget not met — see report"
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
